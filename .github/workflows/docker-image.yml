name: Build and Push Docker Image to DockerHub

on:
  release:
    types: [published]

env:
  DOCKER_IMAGE: francislaboratories/homelogger
  PLATFORMS: linux/amd64,linux/arm64
permissions:
  contents: read
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version components
        id: extract_version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG#*.}"
          MINOR="${MINOR%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Platform Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.event.release.tag_name }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.extract_version.outputs.major }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.extract_version.outputs.major }}.${{ steps.extract_version.outputs.minor }}
